# Giskard configuration — annotated example.
#
# Copy this to your data directory and edit:
#   ${GISKARD_DATA_DIR:-~/.local/share/giskard}/config.toml
#
# Every section is optional; omitted keys fall back to the defaults shown here. Generate the
# password hash with:  cargo run -p giskard-persist --bin giskard-admin -- set-password

[server]
# Address the HTTP/WebSocket server binds to.
bind = "127.0.0.1:8787"
# The session cookie's `Secure` flag. MUST be false when serving over plain HTTP (e.g. local dev):
# with `true`, browsers refuse to send the cookie over http:// and login "succeeds" but nothing
# loads. Set true in production behind HTTPS/TLS.
secure_cookies = false

[logging.file]
# Optional daily rolling file sink in addition to console output. Relative paths are resolved from
# GISKARD_DATA_DIR using normal filesystem semantics, so `..` may select a location outside it. A
# dedicated writer thread consumes a bounded queue and applies backpressure rather than dropping
# records when the queue fills. The configured file name is a prefix: this example writes files
# named giskard-server.log.YYYY-MM-DD, with UTC rotation boundaries. Giskard does not prune old
# daily log files; use an external retention mechanism if they should expire. Missing or invalid
# config and file-sink setup failures are printed directly to stderr; logging begins after both
# load.
enabled = false
path = "logs/giskard-server.log"

[auth]
# Argon2 hash of the single shared app password (never the plaintext). Generate via
# `giskard-admin set-password`. May instead be provided via the GISKARD_PASSWORD_HASH env var.
# Repeated wrong-password attempts are throttled with escalating lockouts (see README §Security).
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$REPLACE_ME"
# Session lifetime in days. Sliding: activity in the second half of the window renews the cookie
# for a full window. Sessions are stateless tokens — to force-invalidate all of them, run
# `giskard-admin revoke-sessions` and restart the server.
session_days = 30

[browse]
# Filesystem scope for the picker AND for project creation. Empty ⇒ the whole filesystem is
# reachable by an authenticated client. Set to a list of absolute paths to confine both (with
# `..`/symlink escapes rejected) to those subtrees — strongly recommended on any instance
# reachable beyond localhost (see README §Security).
roots = []
# e.g. roots = ["/home/you/dev"]

[plan]
# "Save plan to project" default location and filename template ({slug} = thread-title slug,
# {ts} = timestamp). The file is written inside the project's workspace root.
default_dir = "docs"
filename_template = "plan-{slug}-{ts}.md"

[tokens]
# Turn on to compute an estimated euro cost alongside raw token counts.
cost_estimation = false
# Per-model rates in euros per million tokens, keyed by "provider/model". Only used when
# cost_estimation = true.
# [tokens.rates."openai/gpt-5.5"]
# input_per_mtok_eur = 3.0
# output_per_mtok_eur = 10.0
# Claude Code models are keyed under `anthropic`. Their prompt-cache tiers bill cache writes above
# and cache reads below the input rate, so a flat rate is an estimate in both directions.
# [tokens.rates."anthropic/claude-sonnet-5-5"]
# input_per_mtok_eur = 3.0
# output_per_mtok_eur = 15.0

[viz]
# Files larger than this (bytes) are not syntax-highlighted; the code overlay shows metadata only.
max_highlight_size = 10485760   # 10 MiB

[history]
# Turns fetched when a thread is opened. Kept small on purpose: the browser renders the live turn
# first, then tops this up in the background until the transcript fills ~2 screens, so a turn count
# (a turn can hold arbitrarily many items) doesn't over- or under-fetch. `page` is the "scroll up"
# batch for loading older history (infinite scroll).
initial = 5
page = 5

[retention]
# Maximum UTF-8 bytes retained for a completed command's output. Output above the limit keeps a
# UTF-8-safe head and tail with an omission marker. Must be at least 32768 bytes (32 KiB).
max_command_output_bytes = 134217728   # 128 MiB

# ---- Harnesses ----
# This whole section is OPTIONAL. Omitting it means exactly one harness, named `codex`, of kind
# `codex`, launched as `codex` on PATH with Codex's own configuration — which is what every setup
# had before this section existed.
#
# Declare harnesses to run Claude Code, or more than one Codex side by side (a stable and a nightly
# build, or two CODEX_HOMEs). A project picks its default in the new-project dialog; each new thread
# picks its harness from the model picker, which groups models by harness. The rules:
#   * `kind` is `codex` or `claude-code`.
#   * The table key (`codex-stable` below) is the harness's name. It is durable: each project
#     stores its default in project.json and each thread the name it runs on in its thread.json,
#     so renaming or removing a declaration leaves the threads on it read-only until a declaration
#     of that name exists again.
#   * `default = true` may be set on at most one declaration. With none marked, the first declared
#     one is the default. The default is what new projects get when no choice is made.
#   * Declaring the table switches off the synthesized `codex`. Projects and threads created before
#     you declared it are stamped `codex`, so keep a declaration named `codex` for them to open.
#   * `command` is the program to spawn (default: `codex` or `claude` on PATH, by kind); `args` are
#     appended after `app-server --listen stdio://` (Codex) or after the stream-json protocol flags
#     (Claude Code). A bare name is looked up on Giskard's own PATH, not on a PATH set in this
#     declaration's `env`: use an absolute path for a binary that is not on Giskard's PATH, or the
#     one on Giskard's PATH runs instead, with no error.
#   * `[harnesses.<name>.env]` is applied over Giskard's own environment for every process that
#     instance spawns, and for Giskard's own model discovery on its behalf (env-backed keys,
#     headers, and auth commands resolve through it first). Values are literal and are never
#     logged; only the variable names are.
#   * The only Codex-specific key is `profile`, passed as `-c profile=<name>`; the only
#     `claude-code` one is `idle_shutdown_secs`. Any other key is a startup error, as are a blank
#     declaration name, an unknown `kind`, two defaults, a blank command or profile, and an
#     environment variable name that is empty or contains `=`.
#   * Claude Code reads its own login from CLAUDE_CONFIG_DIR (default ~/.claude). Never put
#     ANTHROPIC_API_KEY in `env` or in Giskard's environment unless API billing is intended: it
#     moves a subscriber to API billing.
# Declarations are read once at startup; restart giskard-server after editing them.
#
# [harnesses.codex-stable]
# kind = "codex"
# default = true
#
# [harnesses.codex-nightly]
# kind = "codex"
# command = "/opt/codex-nightly/bin/codex"
# profile = "nightly"
# [harnesses.codex-nightly.env]
# CODEX_HOME = "/home/you/.codex-nightly"
#
# [harnesses.claude]
# kind = "claude-code"
# # `claude` on PATH; set `command` for another binary. Two declarations with different
# # CLAUDE_CONFIG_DIR values are two independent logins, settings and transcript stores.
# # Stop a thread's `claude` process idle this many seconds; its next message resumes it. 0 never.
# idle_shutdown_secs = 600
# [harnesses.claude.env]
# CLAUDE_CONFIG_DIR = "/home/you/.claude"

# ---- Providers ----
# This whole section is OPTIONAL, and most setups need none of it.
#
# Models are found without it. Every provider Codex has a base_url for is discovered from that
# provider's GET /v1/models, and the provider Codex routes to (`model_provider`, or the openai
# built-in) also contributes its own model/list catalog. Display name, base_url, request headers,
# and API key already live in Codex's own ~/.codex/config.toml, and Giskard reads them back rather
# than asking for them twice — so a provider you have already declared to Codex needs no mention
# here at all.
#
# A built-in Codex has no endpoint for and does not route to — `ollama` or `lmstudio` when you use
# neither — has nothing to contribute and will not appear. Declaring models for it is how you put
# it in the picker.
#
# What this section is for:
#   * turning discovery off for a provider  (model_listing = false)
#   * declaring models by hand, for an endpoint that serves no /v1/models
#   * overriding metadata a provider reports badly, or does not report
#   * pinning picker order — declared providers come first, in the order written here; everything
#     else follows by id
#
# Each `id` must name a provider Codex knows — a built-in (`openai`, `amazon-bedrock`,
# `amazon-bedrock-runtime`, `ollama`, `lmstudio`) or one of your `[model_providers.<id>]` entries.
# An id Codex has never heard of is reported as a warning on the picker rather than failing later
# with a provider-side model_not_found.
#
# Discovery authenticates however Codex says to: `env_key` names an environment variable, and
# [model_providers.<id>.auth] names a command whose stdout is the bearer token — Giskard runs it
# each time it needs one. Codex's `http_headers` and `env_http_headers` are also sent. A non-empty
# environment-backed value overrides a literal header of the same name; an unset or blank one
# leaves the literal fallback intact. Bearer authentication is applied last and therefore wins an
# `Authorization` collision. Literal header values are sensitive: Giskard holds them in memory to
# make the request, but does not log, persist, or expose them. Case-insensitive duplicate names
# within either header table are skipped rather than resolved by map iteration order. Nothing to
# configure here either way.

# The table is keyed by the routing id, mirroring Codex's own `[model_providers.<id>]`. An id that
# is not a bare TOML key — one with a dot in it, say — must be quoted: [providers."openrouter.ai"],
# since the unquoted form would read as a provider "openrouter" with a sub-table. Unrecognised keys
# are rejected.

# Turn discovery off for one provider. Then only the models declared here are offered, which is
# what you want for an endpoint that serves turns but has no /v1/models route.
[providers.openai]
model_listing = false
  [[providers.openai.models]]
  id = "gpt-5.5"
  context_window = 262144
  [[providers.openai.models]]
  id = "gpt-5.4"
  context_window = 262144

# Matches `[model_providers.cloudflare-litellm]` in ~/.codex/config.toml, which supplies the
# base_url discovery queries and the env var holding its key. Discovery is on without saying so;
# this entry exists only to add metadata and to put the provider first in the picker.
#
# Declare a model only to give it something the endpoint does not report. context_window is the
# usual reason: a provider serving the plain OpenAI shape often omits it, and Codex's model/list
# has none to give, so such a model starts on the conservative 128k fallback. A provider serving
# the richer catalog shape reports its own windows and needs nothing here.
[providers.cloudflare-litellm]
  [[providers.cloudflare-litellm.models]]
  id = "@cf/z-ai/glm-4.7"
  context_window = 131072
