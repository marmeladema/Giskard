name: E2E

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (matches ci.yml).
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: playwright
    # Must be the Ubuntu release of the Playwright image (`-resolute` in tests/e2e/Dockerfile): the replay
    # server is built here and run in that image, so it must not need a newer glibc than the image's.
    # build-image.sh checks this before any test runs. Bump the two together.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # The same command as a local run: builds the replay server here (release, through the cargo
      # cache above) and the dependencies-only image, then mounts the binary and the suite into it.
      - name: Run Playwright tests
        run: tests/e2e/run.sh

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 14
          if-no-files-found: ignore
